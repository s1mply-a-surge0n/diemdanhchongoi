<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ đồ chỗ ngồi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <header>
    <h1>SƠ ĐỒ CHỌN CHỖ NGỒI</h1>
    <p class="subtitle">Vui lòng chọn ghế và nhập tên của bạn</p>
  </header>

  <div id="status" class="status"></div>

  <div class="legend">
    <div class="legend-item">
      <span class="legend-box green"></span> Ghế trống
    </div>
    <div class="legend-item">
      <span class="legend-box red"></span> Đã có người
    </div>
  </div>

  <div class="toolbar">
    <button class="btn-secondary" onclick="loadData()">🔄 Tải lại</button>
    <button class="btn-primary" onclick="openAdminLogin()">⚙️ Admin</button>
  </div>

  <div id="sections" class="sections"></div>
</div>

<!-- ================= ADMIN LOGIN MODAL ================= -->
<div id="loginModal" class="modal">
  <div class="modal-box small">
    <div class="modal-header">
      <h2>Đăng nhập Admin</h2>
      <button class="close" onclick="closeAdminLogin()">×</button>
    </div>
    <input id="adminPassword" type="password" placeholder="Mật khẩu admin">
    <div class="admin-actions">
      <button class="btn-secondary" onclick="closeAdminLogin()">Hủy</button>
      <button class="btn-primary" onclick="loginAdmin()">Đăng nhập</button>
    </div>
  </div>
</div>

<!-- ================= ADMIN PANEL MODAL ================= -->
<div id="adminModal" class="modal">
  <div class="modal-box large">
    <div class="modal-header">
      <h2>⚙️ Quản lý sơ đồ phòng</h2>
      <button class="close" onclick="closeAdminPanel()">×</button>
    </div>

    <div class="admin-layout">
      <!-- Cột bên trái: Danh sách Khu vực -->
      <div class="admin-sidebar">
        <div class="sidebar-header">
          <strong>Khu vực</strong>
          <button class="btn-sm btn-primary" onclick="addSection()">+ Thêm</button>
        </div>
        <div id="adminSections" class="admin-sections-list"></div>
      </div>

      <!-- Cột bên phải: Trình chỉnh sửa -->
      <div class="admin-main">
        <div id="sectionEditor"></div>
      </div>
    </div>

    <div class="admin-actions">
      <button class="btn-secondary" onclick="closeAdminPanel()">Hủy</button>
      <button class="btn-primary" onclick="saveAdminConfig()">💾 Lưu cấu trúc</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
